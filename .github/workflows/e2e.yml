name: E2E tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Build Java application
        run: mvn -B clean package -DskipTests

      - name: Install Playwright dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start Java application
        run: |
            nohup mvn spring-boot:run \
              -Dspring-boot.run.arguments=--server.port=8080 \
              > app.log 2>&1 &
            echo $! > app.pid   

      - name: Wait for application
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:8080/; then
              echo "Application is up"
              exit 0
            fi
            sleep 2
          done

          echo "Application did not start in time"
          cat app.log
          exit 1      

      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test

      # Sends the result to Testbench, where a failed test becomes one bug (the same test failing again is added to it).
      # Runs even when the tests failed. A problem with the reporting is a warning and never fails the build.
      # Needs the secrets TESTBENCH_URL and TESTBENCH_API_TOKEN and the variable TESTBENCH_PROJECT_ID (the Testbench project's number).
      # Pull requests from forks get no secrets: the script then says so and sends nothing.
      - name: Report results to Testbench
        if: always()
        working-directory: e2e
        env:
          TESTBENCH_URL: ${{ secrets.TESTBENCH_URL }}
          TESTBENCH_PROJECT_ID: ${{ vars.TESTBENCH_PROJECT_ID }}
          TESTBENCH_API_TOKEN: ${{ secrets.TESTBENCH_API_TOKEN }}
        run: node ci-report.mjs results.json

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload results for TestBench
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testbench-results
          path: |
            e2e/results.json
            e2e/test-results/
          retention-days: 7    

      - name: Upload application log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-log
          path: app.log
          retention-days: 7     

      - name: Stop application
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill "$(cat app.pid)" || true
          fi
