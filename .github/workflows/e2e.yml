name: E2E tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Build Java application
        run: mvn -B clean package -DskipTests

      - name: Install Playwright dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start Java application
        run: |
            nohup mvn spring-boot:run \
              -Dspring-boot.run.arguments=--server.port=8080 \
              > app.log 2>&1 &
            echo $! > app.pid   

      - name: Wait for application
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:8080/; then
              echo "Application is up"
              exit 0
            fi
            sleep 2
          done

          echo "Application did not start in time"
          cat app.log
          exit 1      

      - name: Install Playwright browser for the Java tests
        run: >
          mvn -B exec:java -e
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.args="install --with-deps chromium"

      - name: Run Java tests
        env:
          PLAYWRIGHT_HEADLESS: 'true'
        run: mvn -B test

      - name: Run Playwright tests
        if: ${{ !cancelled() }}
        working-directory: e2e
        run: npx playwright test

      - name: Upload Java test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload results for TestBench
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testbench-results
          path: |
            e2e/results.json
            e2e/test-results/
          retention-days: 7    

      - name: Upload application log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-log
          path: app.log
          retention-days: 7     

      - name: Stop application
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill "$(cat app.pid)" || true
          fi
